<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: 'rgb(248 250 252)',
                            100: 'rgb(241 245 249)',
                            200: 'rgb(226 232 240)',
                            300: 'rgb(203 213 225)',
                            400: 'rgb(148 163 184)',
                            500: 'rgb(100 116 139)',
                            600: 'rgb(71 85 105)',
                            700: 'rgb(51 65 85)',
                            800: 'rgb(30 41 59)',
                            900: 'rgb(15 23 42)',
                            950: 'rgb(2 6 23)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-dark-950: 255 255 255;
        }
        
        html.dark {
            --color-dark-950: 2 6 23;
        }
        
        body {
            background-color: rgb(var(--color-dark-950));
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen bg-dark-950 text-dark-100 transition-all duration-300">
    <div class="container mx-auto p-8">
        <div class="max-w-md mx-auto">
            <div class="bg-dark-800/60 backdrop-blur-md border border-dark-700/50 rounded-2xl p-6 dark:bg-dark-800/60 bg-white/80 dark:border-dark-700/50 border-dark-200/50">
                <h1 class="text-2xl font-bold text-dark-50 dark:text-dark-50 text-dark-900 mb-4">Theme Test</h1>
                <p class="text-dark-400 dark:text-dark-400 text-dark-600 mb-6">
                    This is a test to verify that the dark/light mode theme switching works properly.
                </p>
                
                <button onclick="toggleTheme()" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-colors">
                    Toggle Theme
                </button>
                
                <div class="mt-6 p-4 rounded-lg bg-dark-700/50 dark:bg-dark-700/50 bg-dark-100/70">
                    <h3 class="font-medium text-dark-50 dark:text-dark-50 text-dark-900 mb-2">Test Elements:</h3>
                    <ul class="space-y-1 text-sm text-dark-400 dark:text-dark-400 text-dark-600">
                        <li>• Background color changes</li>
                        <li>• Text color adaptation</li>
                        <li>• Card background and borders</li>
                        <li>• Smooth transitions</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Initialize theme
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
        
        if (isDark) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
